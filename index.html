<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Başlangıcı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 100px;
        }
        .container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Merhaba Kucuk Melosum bu siteyi senin için özel olarak tasarladım </h2>
        <p>Küçük görevleri tamamlayarak hediyene ulaşabilirsin.</p>
        <button onclick="startTest()">Teste Başla</button>
    </div>
  
    <script>
        function startTest() {
            window.location.href = "about.html";
        }
    </script>
</body>
</html>
